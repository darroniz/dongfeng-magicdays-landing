<!doctype html>
<html lang="es">
<head>
<!-- Banner de cookies + Consent Mode + GTM-P5RVP4GS (contenedor Dongfeng, el mismo que BOX, VIGO y MAGE).
     Provisional, nuestro, con el mismo aspecto y comportamiento que el CMP de Rigor de dongfeng-auto.es
     (cookie rgcOptin). Cuando Rigor emita el token de magicdays.dongfeng-auto.es y dé código 0, sustituir
     estas dos líneas por:  <script src="https://cookies.rigorcg.pt/script/?token=TOKEN_MAGICDAYS"></script> -->
<link rel="stylesheet" href="/cookies/cmp.css">
<script src="/cookies/cmp.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reserva tu test drive | Dongfeng</title>
<meta name="description" content="Reserva tu prueba de conducción Dongfeng: elige concesionario, modelo, día y hora. Gratis y sin compromiso.">
<link rel="canonical" href="https://magicdays.dongfeng-auto.es/testdrive/">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#232323">
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:locale" content="es_ES">
<meta property="og:site_name" content="Dongfeng España">
<meta property="og:title" content="Reserva tu test drive | Dongfeng">
<meta property="og:description" content="Elige concesionario, modelo, día y hora. Gratis y sin compromiso.">
<meta property="og:image" content="https://magicdays.dongfeng-auto.es/img/og-portada-24nov.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --df-ink:#232323;
  --df-white:#fff;
  --df-grey-600:#7d7d7d;
  --df-grey-300:#cfcfcf;
  --df-grey-100:#f4f4f4;
  --df-font:"Montserrat",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--df-font);color:var(--df-ink);background:var(--df-grey-100);line-height:1.5}
a{color:inherit}
.header{background:var(--df-white);border-bottom:1px solid var(--df-grey-300)}
.header__bar{max-width:760px;margin:0 auto;padding:18px 16px;display:flex;align-items:center}
.logo{display:flex;align-items:center}
.logo img{height:16px;width:auto;filter:brightness(0)}
.main{max-width:760px;margin:0 auto;padding:28px 16px 48px}
h1{font-size:clamp(24px,5vw,34px);line-height:1.15;margin:0 0 8px;font-weight:700}
.lead{margin:0 0 22px;color:var(--df-grey-600);font-size:16px}
.form-card{background:var(--df-white);border-radius:20px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.12)}
.form-frame-wrap{position:relative;background:var(--df-white)}
.form-frame{display:block;width:100%;max-width:720px;height:1500px;margin:0 auto;border:0;background:var(--df-white)}
.form-loading{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;padding-top:80px;font-size:14px;color:var(--df-grey-600);pointer-events:none;transition:opacity .3s}
.form-loading.is-hidden{opacity:0}
.form-fallback{margin:0;padding:16px 20px;border-top:1px solid var(--df-grey-300);font-size:14px;text-align:center;color:var(--df-grey-600)}
.form-fallback a{color:var(--df-ink);font-weight:600}
.privacy{margin:18px 0 0;font-size:13px;color:var(--df-grey-600);text-align:center}
</style>
</head>
<body>

<main class="main">
  <!-- El formulario ya trae su logo y su título: la página no los repite. -->
  <div class="form-card">
    <div class="form-frame-wrap">
      <!-- Mismo formulario de Apps Script; aquí solo cambia la dirección desde la que se abre. -->
      <iframe
        id="df-form"
        class="form-frame"
        title="Reserva tu test drive Dongfeng"
        src="https://script.google.com/macros/s/AKfycbw5gIafOIpVZd7XspZmUIuV6Y8mV2rn1pSOOQdT726AGlwTyK3p2g8RJ0RvJjJeHxDL/exec"
        allow="clipboard-write"
        referrerpolicy="strict-origin-when-cross-origin"></iframe>
      <div class="form-loading" id="form-loading">Cargando formulario…</div>
    </div>
    <p class="form-fallback">¿No ves el formulario? <a href="https://script.google.com/macros/s/AKfycbw5gIafOIpVZd7XspZmUIuV6Y8mV2rn1pSOOQdT726AGlwTyK3p2g8RJ0RvJjJeHxDL/exec" target="_blank" rel="noopener">Ábrelo aquí</a></p>
  </div>

  <p class="privacy">Tratamos tus datos según nuestra <a href="https://drive.google.com/drive/u/0/folders/136miUXOpf13DYom_xgbveNnOzWB6--mV" target="_blank" rel="noopener">política de privacidad</a>.</p>
</main>

<script>
(function(){
  "use strict";
  window.dataLayer = window.dataLayer || [];
  var frame = document.getElementById("df-form");
  var loading = document.getElementById("form-loading");
  frame.addEventListener("load", function(){ loading.classList.add("is-hidden"); });

  /* Altura automática y conversión: los mismos mensajes que usa la landing. */
  window.addEventListener("message", function(e){
    var host = "";
    try { host = new URL(e.origin).hostname; } catch (err) { return; }
    if (!/\.googleusercontent\.com$/.test(host)) return;
    var d = e.data || {};
    if (d.type === "dongfeng-td:altura" && d.altura > 200) {
      frame.style.height = (Math.ceil(d.altura) + 48) + "px";   // +48: el formulario mide solo #app y deja ~20 px fuera (BOM antes de #app); sin margen su documento queda con scroll propio y en iOS atrapa el dedo
    }
    if (d.type === "dongfeng-td:reserva") {
      frame.scrollIntoView({ behavior: "smooth", block: "start" });
      window.dataLayer.push({ event: "test_drive_reservado", concesionario: d.concesionario, modelo: d.modelo });
      window.dataLayer.push({ event: "generate_lead", form_name: "test_drive_formulario", dealer: d.concesionario || "", model: d.modelo || "" });
    }
  });
})();
</script>
</body>
</html>
